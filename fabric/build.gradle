plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

// Gametest delegators live here, not main: shipping them in the release fabric.mod.json breaks
// consumers, since the shared *Scenarios bodies they call are deliberately not in the jar.
// -PwithoutChecks leaves Checks off the dev runs, so the GameTests run as a pack without it would.
def withoutChecks = project.hasProperty('withoutChecks')

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Common is compiled against the same Mojang mappings. Use implementation (not compileOnly) so
    // common's classes/resources are on the dev-run runtime classpath; the production jar bundles
    // and remaps them via the jar/processResources wiring below. Plain implementation (not
    // modImplementation) keeps Loom from trying to remap common — dev runs want its named classes.
    implementation project(':common')

    // Shared GameTest bodies: on the gametest source set only, never bundled into the jar.
    gametestImplementation project(':common').sourceSets.gametest.output

    // Critfall consumed as a published Modrinth artifact (the intermediary-mapped release jar);
    // modImplementation has Loom remap it to named for dev runs and load it as a mod. The version
    // here is a Modrinth version id — see the note in gradle.properties.
    modImplementation "maven.modrinth:critfall:${critfall_fabric_modrinth_id}"

    // Checks on the dev runs only, so the GameTests exercise the Checks path; never a compile dependency.
    if (!withoutChecks) {
        modRuntimeOnly checksArtifact('fabric')
    }
}

loom {
    mixin {
        defaultRefmapName = 'initiative.refmap.json'
    }

    runs {
        server {
            server()
            ideConfigGenerated = true
        }
        client {
            client()
            programArgs '--username', 'Dev1'
        }
        // Second client for two-player playtests: its own game directory so the two do not share
        // a session lock, and its own name so the turn order tells them apart.
        client2 {
            client()
            name = 'Minecraft Client 2'
            runDir = 'run2'
            programArgs '--username', 'Dev2'
            ideConfigGenerated = true
        }
        // Its own run directory, for the reason spelled out on the NeoForge gameTestServer run.
        gametest {
            server()
            name = 'Game Test'
            runDir = 'run-gametest'
            source sourceSets.gametest
            property 'fabric-api.gametest'
            property 'fabric-api.gametest.report-file', "${project.buildDir}/junit.xml"
            if (withoutChecks) {
                property 'initiative.gametest.withoutChecks', 'true'
            }
            ideConfigGenerated = true
        }
    }
}

// Bundle common's compiled classes so remapJar remaps them into the Fabric jar. Common's
// resources come through processResources below (bundling output too would duplicate them).
jar {
    from project(':common').sourceSets.main.output.classesDirs
}

processResources {
    from project(':common').sourceSets.main.resources

    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : project.version,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_issue_tracker      : mod_issue_tracker,
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version  : fabric_loader_version,
            critfall_min_version   : critfall_min_version,
            checks_min_version     : checks_min_version,
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand props
    }
}
