# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_id=initiative
mod_name=Critfall: Initiative
mod_version=0.1.1
mod_group=studio.modroll.initiative
mod_authors=Modroll Studio
mod_description=Turn-based, initiative-driven combat for Minecraft, built on Critfall's d20 engine.
mod_license=MIT
mod_issue_tracker=https://github.com/modrollstudio/Initiative/issues

# Critfall dependency — resolved from the Modrinth maven as maven.modrinth:critfall:<version>.
# Critfall uploads one Modrinth version per loader under the same version number, so only one of
# them keeps that number as its maven coordinate (currently NeoForge) and the other is addressable
# only by its opaque Modrinth version id. Bump this id with every Critfall release; it goes away if
# Critfall ever publishes loader-suffixed version numbers.
critfall_version=0.2.6
critfall_fabric_modrinth_id=EVrw8wNx
critfall_version_range=[0.2.6,)

# Checks soft dependency: optional at runtime, so Initiative only compiles against it. Consumed from
# the local Maven repo (publish it from the Checks repo first) until Checks is on Modrinth.
checks_version=0.1.0
checks_version_range=[0.1.0,)

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.235
neoforge_version_range=[21.1.0,)

# Fabric
fabric_loom_version=1.9-SNAPSHOT
fabric_loader_version=0.16.9
fabric_api_version=0.109.0+1.21.1

# Tooling
java_version=21
junit_version=5.11.4
