# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod metadata
mod_id=initiative
mod_name=Critfall: Initiative
mod_version=0.2.1
mod_group=studio.modroll.initiative
mod_authors=Modroll Studio
mod_description=Turn-based, initiative-driven combat for Minecraft, built on Critfall's d20 engine.
mod_license=MIT
mod_issue_tracker=https://github.com/modrollstudio/Initiative/issues

# Critfall dependency — resolved from the Modrinth maven as maven.modrinth:critfall:<id>.
# Critfall uploads one Modrinth version per loader (as `<version>+neoforge` / `+fabric` since 0.2.9,
# under one shared version number before), so each loader's jar is pinned by its opaque Modrinth
# version id. Bump both ids with every Critfall release; critfall_version only names the pinned
# release. Both loaders declare critfall_min_version as the minimum: the oldest release that has every
# Critfall class and member the shipped jars reference. 0.2.16 is the first whose missed arrows fly on
# past their target, which ranged attacks in an encounter rely on.
critfall_version=0.2.16
critfall_neoforge_modrinth_id=QhrMGVFM
critfall_fabric_modrinth_id=Mw5d4P7h
critfall_min_version=0.2.16
critfall_version_range=[0.2.16,)

# Checks soft dependency: optional at runtime, so Initiative only compiles against it and puts it on
# the dev runs. Pinned like Critfall, by each loader's Modrinth version id (maven.modrinth:critfall-checks:<id>).
# TEMPORARY: Checks has no Modrinth versions yet, so while a loader's Modrinth id is empty its jar
# comes from CurseForge through CurseMaven instead, as curse.maven:critfall-checks-<project>:<file id>.
# Fill in both Modrinth ids and the CurseForge ids below go unused (then delete them and the
# CurseMaven repo in build.gradle).
checks_version=0.1.3
checks_neoforge_modrinth_id=
checks_fabric_modrinth_id=
checks_curseforge_project_id=1735843
checks_neoforge_curseforge_file_id=9279624
checks_fabric_curseforge_file_id=9279620
checks_min_version=0.1.0
checks_version_range=[0.1.0,)

# Platform versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.235
neoforge_version_range=[21.1.0,)

# Fabric
fabric_loom_version=1.9-SNAPSHOT
fabric_loader_version=0.16.9
fabric_api_version=0.109.0+1.21.1

# Tooling
java_version=21
junit_version=5.11.4
