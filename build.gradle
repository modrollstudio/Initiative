plugins {
    id 'com.diffplug.spotless' version '8.8.0' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'

    group = mod_group
    // Loader jars carry the loader in their version (0.1.0+neoforge / 0.1.0+fabric) so each
    // loader's Modrinth upload gets its own version number, and with it its own maven coordinate.
    version = project.name in ['neoforge', 'fabric'] ? "${mod_version}+${project.name}" : mod_version
    base.archivesName = "${mod_id}-${project.name}"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    }

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        // Stand-in for Checks while its Modrinth ids are unset; see checksArtifact below.
        mavenLocal {
            content { includeGroup 'studio.modroll.checks' }
        }
    }

    // A loader's Checks jar: pinned by Modrinth version id like Critfall, or the local Maven publish
    // while that id is still empty in gradle.properties.
    ext.checksArtifact = { String loader ->
        def modrinthId = project.property("checks_${loader}_modrinth_id")
        modrinthId ? "maven.modrinth:critfall-checks:${modrinthId}" : "studio.modroll.checks:checks-${loader}:${checks_version}"
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junit_version}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat = 'full'
        }
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            palantirJavaFormat()
            removeUnusedImports()
            importOrder()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    // A shipped gametest entrypoint whose *Scenarios body is not in the jar breaks every
    // consumer's gametest run — this guard fails the build if gametest code reaches a release jar.
    afterEvaluate {
        def releaseJar = plugins.hasPlugin('fabric-loom') ? tasks.remapJar : tasks.jar
        def guard = tasks.register('verifyNoGametestInReleaseJar') {
            dependsOn releaseJar
            def jarFile = releaseJar.archiveFile
            doLast {
                def offenders = []
                new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.name.toLowerCase().contains('gametest')) {
                            offenders << entry.name
                        }
                    }
                    def modJson = zip.getEntry('fabric.mod.json')
                    if (modJson != null && zip.getInputStream(modJson).getText('UTF-8').contains('gametest')) {
                        offenders << 'fabric.mod.json declares a gametest entrypoint'
                    }
                }
                if (!offenders.isEmpty()) {
                    throw new GradleException("gametest leaked into ${jarFile.get().asFile.name}: ${offenders}")
                }
            }
        }
        tasks.named('check') { it.dependsOn(guard) }
    }
}
